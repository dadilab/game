<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全能单位换算器</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 统一的 Tailwind 配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#6366f1',
            accent: '#10b981',
            dark: '#1e293b',
            light: '#f8fafc'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .glass-effect {
        @apply bg-white bg-opacity-20 backdrop-blur-lg;
      }
      .card-shadow {
        @apply shadow-lg hover:shadow-xl transition-shadow duration-300;
      }
      .btn-primary {
        @apply bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50;
      }
      .btn-secondary {
        @apply bg-secondary hover:bg-secondary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-opacity-50;
      }
      .input-field {
        @apply w-full px-4 py-2 border border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300;
      }
      .select-field {
        @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 appearance-none bg-white;
      }
      .tab-active {
        @apply border-b-2 border-primary text-primary;
      }
      .tab-inactive {
        @apply text-gray-500 hover:text-gray-700;
      }
    }

  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <!-- 头部 -->
    <header class="text-center mb-8 animate-fade-in">
      <h1 class="text-4xl font-bold text-dark mb-2 bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">全能单位换算器</h1>
      <p class="text-gray-600">支持多种科学单位和日常单位的精确换算</p>
    </header>

    <!-- 主内容区 -->
    <main class="bg-white rounded-2xl card-shadow p-6 mb-8 animate-slide-up">
      <!-- 单位类别选择标签页 -->
      <div class="mb-6 overflow-x-auto">
        <div class="flex space-x-1 md:space-x-4 min-w-max pb-2" id="category-tabs">
          <!-- 标签页将通过 JavaScript 动态生成 -->
        </div>
      </div>

      <!-- 换算内容区 -->
      <div id="converter-content" class="animate-fade-in">
        <!-- 换算内容将通过 JavaScript 动态生成 -->
        <div class="text-center py-12 text-gray-500">
          <i class="fa fa-exchange text-4xl mb-4"></i>
          <p>请选择一个单位类别开始换算</p>
        </div>
      </div>
    </main>

    <!-- 换算历史记录 -->
    <div class="bg-white rounded-2xl card-shadow p-6 animate-fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-dark">换算历史记录</h2>
        <button id="clear-history" class="text-sm text-gray-500 hover:text-red-500 transition-colors">
          <i class="fa fa-trash-o mr-1"></i> 清空
        </button>
      </div>
      <div id="history-list" class="max-h-48 overflow-y-auto">
        <div class="text-center py-4 text-gray-400 text-sm">
          暂无换算历史记录
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <footer class="mt-8 text-center text-gray-500 text-sm">
      <p>© 2025 全能单位换算器 | 设计与开发</p>
    </footer>
  </div>

          'Re': {

      angle: {

          'mas': { name: '毫秒', base: Math.PI / (180 * 3600 * 1000), system: 'imperial' },

        }
      },
      currency: {

      },
      illuminance: {

          'lm/m2': { name: '流明/平方米', base: 1, system: 'metric' },
          'ph_alt': { name: '辐透', base: 10000, system: 'metric' },
          'mlx': { name: '毫勒克斯', base: 0.001, system: 'metric' },
          'μlx': { name: '微勒克斯', base: 1e-6, system: 'metric' },
          'klx': { name: '千勒克斯', base: 1000, system: 'metric' },
          'nox': { name: '诺克斯', base: 1, system: 'metric' },
          // 英制
          'lm/in2': { name: '流明/平方英寸', base: 1550, system: 'imperial' },
          'lm/ft2': { name: '流明/平方英尺', base: 10.7639, system: 'imperial' },
          'fc': { name: '英尺烛光', base: 10.7639, system: 'imperial' }
        }
      },
      torque: {
        name: '力矩单位',
        units: {
          // 公制
          'μNm': { name: '微牛米', base: 1e-6, system: 'metric' },
          'mNm': { name: '毫牛米', base: 0.001, system: 'metric' },
          'kN·m': { name: '千牛米', base: 1000, system: 'metric' },
          'MN·m': { name: '兆牛米', base: 1e6, system: 'metric' },
          'kgf·m': { name: '千克力米', base: 9.80665, system: 'metric' },
          'kgfm': { name: '公斤力米', base: 9.80665, system: 'metric' },
          'dyn·cm': { name: '达因厘米', base: 1e-7, system: 'metric' },
          // 英制
          'lbf·ft': { name: '英尺磅', base: 1.35582, system: 'imperial' },
          'lbfft': { name: '磅力英尺', base: 1.35582, system: 'imperial' },
          'lbf·in': { name: '英寸磅', base: 0.112985, system: 'imperial' },
          'lbfin': { name: '磅力英寸', base: 0.112985, system: 'imperial' },
          'ozf·ft': { name: '盎司力英尺', base: 0.084739, system: 'imperial' },
          'ozfin': { name: '盎司力英寸', base: 0.00706155, system: 'imperial' }
        }
      },
      resistance: {
        name: '电阻单位',
        units: {
          'kΩ': { name: '千欧', base: 1000, system: 'metric' },
          'mΩ': { name: '毫欧', base: 0.001, system: 'metric' },
          'μΩ': { name: '微欧', base: 1e-6, system: 'metric' },
          'nΩ': { name: '纳欧', base: 1e-9, system: 'metric' },
          'MΩ': { name: '兆欧', base: 1e6, system: 'metric' },
          'GΩ': { name: '吉欧', base: 1e9, system: 'metric' },
          'abΩ': { name: '绝对欧姆', base: 1e-9, system: 'metric' }
        }
      },
      time: {
        name: '时间单位',
        units: {
          'yr': { name: '年', base: 31536000, system: 'metric' },
          'month': { name: '月', base: 2592000, system: 'metric' },
          'week': { name: '周', base: 604800, system: 'metric' },
          'd': { name: '天', base: 86400, system: 'metric' },
          'h': { name: '时', base: 3600, system: 'metric' },
          'min': { name: '分', base: 60, system: 'metric' },
          's': { name: '秒', base: 1, system: 'metric' },
          'ms': { name: '毫秒', base: 0.001, system: 'metric' },
          'μs': { name: '微秒', base: 1e-6, system: 'metric' },
          'ns': { name: '纳秒', base: 1e-9, system: 'metric' }
        }
      },
      area: {
        name: '面积单位',
        units: {
          // 公制
          'km2': { name: '平方千米', base: 1e6, system: 'metric' },
          'ha': { name: '公顷', base: 10000, system: 'metric' },
          'are': { name: '公亩', base: 100, system: 'metric' },
          'm2': { name: '平方米', base: 1, system: 'metric' },
          'dm2': { name: '平方分米', base: 0.01, system: 'metric' },
          'cm2': { name: '平方厘米', base: 1e-4, system: 'metric' },
          'mm2': { name: '平方毫米', base: 1e-6, system: 'metric' },
          'km2_alt': { name: '平方公里', base: 1e6, system: 'metric' },
          'hm2': { name: '平方百米', base: 10000, system: 'metric' },
          // 英制
          'acre': { name: '英亩', base: 4046.86, system: 'imperial' },
          'sq.mi': { name: '平方英里', base: 2589990, system: 'imperial' },
          'sq.yd': { name: '平方码', base: 0.836127, system: 'imperial' },
          'sq.ft': { name: '平方英尺', base: 0.092903, system: 'imperial' },
          'sq.in': { name: '平方英寸', base: 6.4516e-4, system: 'imperial' },
          'sq.rd': { name: '平方竿', base: 25.2929, system: 'imperial' },
          // 市制
          'qing': { name: '顷', base: 66666.67, system: 'chinese' },
          'mu': { name: '亩', base: 666.6667, system: 'chinese' },
          'fen_area': { name: '分', base: 66.6667, system: 'chinese' },
          'sq.chi': { name: '平方尺', base: 0.111111, system: 'chinese' },
          'sq.cun': { name: '平方寸', base: 0.001111, system: 'chinese' }
        }
      },
      voltage: {
        name: '电压单位',
        units: {
          'kV': { name: '千伏', base: 1000, system: 'metric' },
          'V': { name: '伏特', base: 1, system: 'metric' },
          'mV': { name: '毫伏', base: 0.001, system: 'metric' },
          'μV': { name: '微伏', base: 1e-6, system: 'metric' }
        }
      },
      current: {
        name: '电流单位',
        units: {
          'kA': { name: '千安', base: 1000, system: 'metric' },
          'A': { name: '安培', base: 1, system: 'metric' },
          'mA': { name: '毫安', base: 0.001, system: 'metric' },
          'μA': { name: '微安', base: 1e-6, system: 'metric' }
        }
      }
    };

    // 历史记录
    let conversionHistory = [];

    // DOM 元素
    const categoryTabs = document.getElementById('category-tabs');
    const converterContent = document.getElementById('converter-content');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history');

    // 初始化页面
    function initPage() {
      // 创建单位类别标签页
      createCategoryTabs();
      
      // 加载历史记录
      loadHistory();
      
      // 绑定事件
      clearHistoryBtn.addEventListener('click', clearHistory);
    }

    // 创建单位类别标签页
    function createCategoryTabs() {
      categoryTabs.innerHTML = '';
      
      Object.keys(unitData).forEach((categoryKey, index) => {
        const category = unitData[categoryKey];
        const tab = document.createElement('button');
        tab.className = `px-3 py-2 text-sm font-medium rounded-t-lg transition-colors ${index === 0 ? 'tab-active' : 'tab-inactive'}`;
        tab.textContent = category.name;
        tab.dataset.category = categoryKey;
        
        tab.addEventListener('click', () => {
          // 更新标签页样式
          document.querySelectorAll('#category-tabs button').forEach(t => {
            t.classList.remove('tab-active');
            t.classList.add('tab-inactive');
          });
          tab.classList.remove('tab-inactive');
          tab.classList.add('tab-active');
          
          // 显示对应单位类别的换算器
          showConverter(categoryKey);
        });
        
        categoryTabs.appendChild(tab);
      });
      
      // 默认显示第一个单位类别的换算器
      if (Object.keys(unitData).length > 0) {
        showConverter(Object.keys(unitData)[0]);
      }
    }

    // 显示单位换算器
    function showConverter(categoryKey) {
      const category = unitData[categoryKey];
      
      // 创建换算器HTML
      let html = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 输入部分 -->
          <div class="bg-blue-50 rounded-xl p-6">
            <div class="mb-4">
              <label for="input-value" class="block text-sm font-medium text-gray-700 mb-1">输入值</label>
              <input type="number" id="input-value" class="input-field" placeholder="请输入数值" step="any">
            </div>
            <div class="mb-4">
              <label for="from-unit" class="block text-sm font-medium text-gray-700 mb-1">从</label>
              <div class="relative">
                <select id="from-unit" class="select-field pr-8">
                  <option value="">请选择单位</option>
                  ${createUnitOptions(category.units)}
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                  <i class="fa fa-chevron-down text-xs"></i>
                </div>
              </div>
            </div>
          </div>
          
          <!-- 输出部分 -->
          <div class="bg-indigo-50 rounded-xl p-6">
            <div class="mb-4">
              <label for="output-value" class="block text-sm font-medium text-gray-700 mb-1">结果</label>
              <input type="number" id="output-value" class="input-field" readonly step="any">
            </div>
            <div class="mb-4">
              <label for="to-unit" class="block text-sm font-medium text-gray-700 mb-1">到</label>
              <div class="relative">
                <select id="to-unit" class="select-field pr-8">
                  <option value="">请选择单位</option>
                  ${createUnitOptions(category.units)}
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                  <i class="fa fa-chevron-down text-xs"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="flex flex-wrap justify-center gap-4 mt-6">
          <button id="swap-btn" class="btn-secondary">
            <i class="fa fa-refresh mr-2"></i>交换单位
          </button>
          <button id="copy-btn" class="btn-secondary">
            <i class="fa fa-copy mr-2"></i>复制结果
          </button>
        </div>
        
        <!-- 换算公式 -->
        <div class="mt-6 p-4 bg-gray-50 rounded-lg">
          <h3 class="text-sm font-medium text-gray-700 mb-2">换算公式</h3>
          <p id="formula" class="text-sm text-gray-600">请输入数值并选择单位进行换算</p>
        </div>
      `;
      
      converterContent.innerHTML = html;
      
      // 获取元素
      const inputValue = document.getElementById('input-value');
      const fromUnit = document.getElementById('from-unit');
      const toUnit = document.getElementById('to-unit');
      
      // 绑定事件
      inputValue.addEventListener('input', () => debounce(() => convertUnit(categoryKey), 300));
      fromUnit.addEventListener('change', () => convertUnit(categoryKey));
      toUnit.addEventListener('change', () => convertUnit(categoryKey));
      document.getElementById('swap-btn').addEventListener('click', swapUnits);
      document.getElementById('copy-btn').addEventListener('click', copyResult);
    }

    // 创建单位选项
    function createUnitOptions(units) {
      let options = '';
      
      // 按单位系统分组
      const systems = {
        metric: { name: '公制', units: [] },
        imperial: { name: '英制', units: [] },
        chinese: { name: '市制', units: [] }
      };
      
      Object.keys(units).forEach(unitKey => {
        const unit = units[unitKey];
        if (systems[unit.system]) {
          systems[unit.system].units.push({ key: unitKey, ...unit });
        } else {
          // 如果单位系统不在预定义列表中，添加到公制
          systems.metric.units.push({ key: unitKey, ...unit });
        }
      });
      
      // 生成选项HTML
      Object.keys(systems).forEach(systemKey => {
        const system = systems[systemKey];
        if (system.units.length > 0) {
          options += `<optgroup label="${system.name}">`;
          system.units.forEach(unit => {
            options += `<option value="${unit.key}">${unit.name} (${unit.key})</option>`;
          });
          options += '</optgroup>';
        }
      });
      
      return options;
    }

    // 单位换算
    function convertUnit(categoryKey) {
      const inputValue = document.getElementById('input-value').value;
      const fromUnit = document.getElementById('from-unit').value;
      const toUnit = document.getElementById('to-unit').value;
      const outputValue = document.getElementById('output-value');
      const formula = document.getElementById('formula');
      
      // 验证输入
      if (!inputValue || !fromUnit || !toUnit) {
        outputValue.value = '';
        formula.textContent = '请输入数值并选择单位进行换算';
        return;
      }
      
      const value = parseFloat(inputValue);
      const category = unitData[categoryKey];
      const fromUnitData = category.units[fromUnit];
      const toUnitData = category.units[toUnit];
      
      let result;
      let formulaText;
      
      // 特殊处理温度单位
      if (categoryKey === 'temperature') {
        // 转换为开尔文（基础单位）
        const kelvin = fromUnitData.toBase(value);
        // 从开尔文转换为目标单位
        result = toUnitData.fromBase(kelvin);
        
        formulaText = `${value} ${fromUnitData.name} = ${result.toFixed(6)} ${toUnitData.name}`;
      } else {
        // 其他单位的换算
        // 转换为基础单位
        const baseValue = value * fromUnitData.base;
        // 从基础单位转换为目标单位
        result = baseValue / toUnitData.base;
        
        formulaText = `${value} ${fromUnitData.name} = ${value} × ${fromUnitData.base} ÷ ${toUnitData.base} = ${result.toFixed(6)} ${toUnitData.name}`;
      }
      
      // 显示结果
      outputValue.value = result;
      formula.textContent = formulaText;
      
      // 添加到历史记录
      addToHistory({
        category: category.name,
        inputValue: value,
        fromUnit: fromUnitData.name,
        fromUnitSymbol: fromUnit,
        outputValue: result,
        toUnit: toUnitData.name,
        toUnitSymbol: toUnit,
        timestamp: new Date().toISOString()
      });
    }

    // 交换单位
    function swapUnits() {
      const fromUnit = document.getElementById('from-unit');
      const toUnit = document.getElementById('to-unit');
      const inputValue = document.getElementById('input-value');
      const outputValue = document.getElementById('output-value');
      
      // 保存当前值
      const tempUnit = fromUnit.value;
      const tempValue = inputValue.value;
      
      // 交换单位和值
      fromUnit.value = toUnit.value;
      toUnit.value = tempUnit;
      inputValue.value = outputValue.value;
      outputValue.value = tempValue;
    }

    // 复制结果
    function copyResult() {
      const outputValue = document.getElementById('output-value');
      
      // 选择结果文本
      outputValue.select();
      outputValue.setSelectionRange(0, 99999); // 兼容移动设备
      
      // 复制到剪贴板
      document.execCommand('copy');
      
      // 显示提示
      alert('结果已复制到剪贴板');
    }

    // 添加到历史记录
    function addToHistory(item) {
      // 添加到历史记录数组
      conversionHistory.unshift(item);
      
      // 限制历史记录数量
      if (conversionHistory.length > 10) {
        conversionHistory.pop();
      }
      
      // 保存到本地存储
      localStorage.setItem('conversionHistory', JSON.stringify(conversionHistory));
      
      // 更新历史记录显示
      updateHistoryList();
    }

    // 加载历史记录
    function loadHistory() {
      const savedHistory = localStorage.getItem('conversionHistory');
      if (savedHistory) {
        conversionHistory = JSON.parse(savedHistory);
        updateHistoryList();
      }
    }

    // 更新历史记录显示
    function updateHistoryList() {
      if (conversionHistory.length === 0) {
        historyList.innerHTML = `
          <div class="text-center py-4 text-gray-400 text-sm">
            暂无换算历史记录
          </div>
        `;
        return;
      }
      
      let html = '';
      conversionHistory.forEach((item, index) => {
        const date = new Date(item.timestamp);
        const timeString = `${date.getFullYear()}-${padZero(date.getMonth() + 1)}-${padZero(date.getDate())} ${padZero(date.getHours())}:${padZero(date.getMinutes())}`;
        
        html += `
          <div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0 hover:bg-gray-50 px-2 rounded transition-colors">
            <div class="flex-1">
              <p class="text-sm font-medium">${item.inputValue} ${item.fromUnit} = ${item.outputValue.toFixed(6)} ${item.toUnit}</p>
              <p class="text-xs text-gray-500">${item.category} · ${timeString}</p>
            </div>
            <div class="flex space-x-2">
              <button class="text-gray-400 hover:text-primary transition-colors" onclick="useHistoryItem(${index})" title="使用此记录">
                <i class="fa fa-refresh"></i>
              </button>
              <button class="text-gray-400 hover:text-red-500 transition-colors" onclick="deleteHistoryItem(${index})" title="删除此记录">
                <i class="fa fa-trash-o"></i>
              </button>
            </div>
          </div>
        `;
      });
      
      historyList.innerHTML = html;
    }

    // 使用历史记录项
    function useHistoryItem(index) {
      const item = conversionHistory[index];
      
      // 找到对应的单位类别
      let categoryKey = '';
      Object.keys(unitData).forEach(key => {
        if (unitData[key].name === item.category) {
          categoryKey = key;
        }
      });
      
      if (!categoryKey) return;
      
      // 切换到对应的标签页
      document.querySelectorAll('#category-tabs button').forEach(tab => {
        if (tab.dataset.category === categoryKey) {
          tab.click();
        }
      });
      
      // 填充值和单位
      setTimeout(() => {
        document.getElementById('input-value').value = item.inputValue;
        
        // 设置单位
        const fromUnitSelect = document.getElementById('from-unit');
        const toUnitSelect = document.getElementById('to-unit');
        
        for (let i = 0; i < fromUnitSelect.options.length; i++) {
          if (fromUnitSelect.options[i].value === item.fromUnitSymbol) {
            fromUnitSelect.selectedIndex = i;
            break;
          }
        }
        
        for (let i = 0; i < toUnitSelect.options.length; i++) {
          if (toUnitSelect.options[i].value === item.toUnitSymbol) {
            toUnitSelect.selectedIndex = i;
            break;
          }
        }
        
        // 执行换算
        convertUnit(categoryKey);
      }, 100);
    }

    // 清空历史记录
    function clearHistory() {
      if (confirm('确定要清空所有换算历史记录吗？')) {
        conversionHistory = [];
        localStorage.removeItem('conversionHistory');
        updateHistoryList();
      }
    }
    
    // 删除单个历史记录项
    function deleteHistoryItem(index) {
      if (confirm('确定要删除这条历史记录吗？')) {
        conversionHistory.splice(index, 1);
        localStorage.setItem('conversionHistory', JSON.stringify(conversionHistory));
        updateHistoryList();
      }
    }

    // 防抖函数
    function debounce(func, wait) {
      let timeout;
      return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
      };
    }
    
    // 辅助函数：数字补零
    function padZero(num) {
      return num < 10 ? `0${num}` : num;
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
