<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全能单位换算器</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 配置Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#6366f1',
            accent: '#10b981',
            dark: '#1e293b',
            light: '#f8fafc'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .result-item {
        @apply p-3 border-b border-gray-100 hover:bg-gray-50 transition-colors;
      }
      .result-item-header {
        @apply font-medium text-sm text-gray-700;
      }
      .result-item-value {
        @apply text-lg font-semibold text-primary mt-1;
      }
      .system-badge {
        @apply text-xs px-2 py-0.5 rounded-full ml-2;
      }
      .metric-badge {
        @apply bg-blue-100 text-blue-800 system-badge;
      }
      .imperial-badge {
        @apply bg-green-100 text-green-800 system-badge;
      }
      .chinese-badge {
        @apply bg-yellow-100 text-yellow-800 system-badge;
      }
    }
  </style>
</head>

      <p class="text-gray-600">实时显示所有单位换算结果，支持多种科学与日常单位</p>

        </div>
      </div>

          'ph_alt': { name: '辐透', base: 10000, system: 'metric' },
          'mlx': { name: '毫勒克斯', base: 0.001, system: 'metric' },
          'μlx': { name: '微勒克斯', base: 1e-6, system: 'metric' },
          'klx': { name: '千勒克斯', base: 1000, system: 'metric' },
          'nox': { name: '诺克斯', base: 1, system: 'metric' },
          // 英制
          'lm/in2': { name: '流明/平方英寸', base: 1550, system: 'imperial' },
          'lm/ft2': { name: '流明/平方英尺', base: 10.7639, system: 'imperial' },
          'fc': { name: '英尺烛光', base: 10.7639, system: 'imperial' }
        }
      },
      torque: {
        name: '力矩单位',
        units: {
          // 公制
          'μNm': { name: '微牛米', base: 1e-6, system: 'metric' },
          'mNm': { name: '毫牛米', base: 0.001, system: 'metric' },
          'kN·m': { name: '千牛米', base: 1000, system: 'metric' },
          'MN·m': { name: '兆牛米', base: 1e6, system: 'metric' },
          'kgf·m': { name: '千克力米', base: 9.80665, system: 'metric' },
          'kgfm': { name: '公斤力米', base: 9.80665, system: 'metric' },
          'dyn·cm': { name: '达因厘米', base: 1e-7, system: 'metric' },
          // 英制
          'lbf·ft': { name: '英尺磅', base: 1.35582, system: 'imperial' },
          'lbfft': { name: '磅力英尺', base: 1.35582, system: 'imperial' },
          'lbf·in': { name: '英寸磅', base: 0.112985, system: 'imperial' },
          'lbfin': { name: '磅力英寸', base: 0.112985, system: 'imperial' },
          'ozf·ft': { name: '盎司力英尺', base: 0.084739, system: 'imperial' },
          'ozfin': { name: '盎司力英寸', base: 0.00706155, system: 'imperial' }
        }
      },
      resistance: {
        name: '电阻单位',
        units: {
          'kΩ': { name: '千欧', base: 1000, system: 'metric' },
          'mΩ': { name: '毫欧', base: 0.001, system: 'metric' },
          'μΩ': { name: '微欧', base: 1e-6, system: 'metric' },
          'nΩ': { name: '纳欧', base: 1e-9, system: 'metric' },
          'MΩ': { name: '兆欧', base: 1e6, system: 'metric' },
          'GΩ': { name: '吉欧', base: 1e9, system: 'metric' },
          'abΩ': { name: '绝对欧姆', base: 1e-9, system: 'metric' }
        }
      },
      time: {
        name: '时间单位',
        units: {
          'yr': { name: '年', base: 31536000, system: 'metric' },
          'month': { name: '月', base: 2592000, system: 'metric' },
          'week': { name: '周', base: 604800, system: 'metric' },
          'd': { name: '天', base: 86400, system: 'metric' },
          'h': { name: '时', base: 3600, system: 'metric' },
          'min': { name: '分', base: 60, system: 'metric' },
          's': { name: '秒', base: 1, system: 'metric' },
          'ms': { name: '毫秒', base: 0.001, system: 'metric' },
          'μs': { name: '微秒', base: 1e-6, system: 'metric' },
          'ns': { name: '纳秒', base: 1e-9, system: 'metric' }
        }
      },
      area: {
        name: '面积单位',
        units: {
          // 公制
          'km2': { name: '平方千米', base: 1e6, system: 'metric' },
          'ha': { name: '公顷', base: 10000, system: 'metric' },
          'are': { name: '公亩', base: 100, system: 'metric' },
          'm2': { name: '平方米', base: 1, system: 'metric' },
          'dm2': { name: '平方分米', base: 0.01, system: 'metric' },
          'cm2': { name: '平方厘米', base: 1e-4, system: 'metric' },
          'mm2': { name: '平方毫米', base: 1e-6, system: 'metric' },
          'km2_alt': { name: '平方公里', base: 1e6, system: 'metric' },
          'hm2': { name: '平方百米', base: 10000, system: 'metric' },
          // 英制
          'acre': { name: '英亩', base: 4046.86, system: 'imperial' },
          'sq.mi': { name: '平方英里', base: 2589990, system: 'imperial' },
          'sq.yd': { name: '平方码', base: 0.836127, system: 'imperial' },
          'sq.ft': { name: '平方英尺', base: 0.092903, system: 'imperial' },
          'sq.in': { name: '平方英寸', base: 6.4516e-4, system: 'imperial' },
          'sq.rd': { name: '平方竿', base: 25.2929, system: 'imperial' },
          // 市制
          'qing': { name: '顷', base: 66666.67, system: 'chinese' },
          'mu': { name: '亩', base: 666.6667, system: 'chinese' },
          'fen_area': { name: '分', base: 66.6667, system: 'chinese' },
          'sq.chi': { name: '平方尺', base: 0.111111, system: 'chinese' },
          'sq.cun': { name: '平方寸', base: 0.001111, system: 'chinese' }
        }
      },
      voltage: {
        name: '电压单位',
        units: {
          'kV': { name: '千伏', base: 1000, system: 'metric' },
          'V': { name: '伏特', base: 1, system: 'metric' },
          'mV': { name: '毫伏', base: 0.001, system: 'metric' },
          'μV': { name: '微伏', base: 1e-6, system: 'metric' }
        }
      },
      current: {
        name: '电流单位',
        units: {
          'kA': { name: '千安', base: 1000, system: 'metric' },
          'A': { name: '安培', base: 1, system: 'metric' },
          'mA': { name: '毫安', base: 0.001, system: 'metric' },
          'μA': { name: '微安', base: 1e-6, system: 'metric' }
        }
      }
    };

    // DOM 元素
    const categoryTabs = document.getElementById('category-tabs');
    const converterContent = document.getElementById('converter-content');

    // 初始化页面
    function initPage() {
      // 创建单位类别标签页
      createCategoryTabs();
    }

    // 创建单位类别标签页
    function createCategoryTabs() {
      categoryTabs.innerHTML = '';
      
      Object.keys(unitData).forEach((categoryKey, index) => {
        const category = unitData[categoryKey];
        const tab = document.createElement('button');
        tab.className = `px-3 py-2 text-sm font-medium rounded-t-lg transition-colors ${index === 0 ? 'border-b-2 border-primary text-primary' : 'text-gray-500 hover:text-gray-700'}`;
        tab.textContent = category.name;
        tab.dataset.category = categoryKey;
        
        tab.addEventListener('click', () => {
          // 更新标签页样式
          document.querySelectorAll('#category-tabs button').forEach(t => {
            t.classList.remove('border-b-2', 'border-primary', 'text-primary');
            t.classList.add('text-gray-500', 'hover:text-gray-700');
          });
          tab.classList.remove('text-gray-500', 'hover:text-gray-700');
          tab.classList.add('border-b-2', 'border-primary', 'text-primary');
          
          // 显示对应单位类别的换算器
          showConverter(categoryKey);
        });
        
        categoryTabs.appendChild(tab);
      });
      
      // 默认显示第一个单位类别的换算器
      if (Object.keys(unitData).length > 0) {
        showConverter(Object.keys(unitData)[0]);
      }
    }

    // 显示单位换算器
    function showConverter(categoryKey) {
      const category = unitData[categoryKey];
      const units = category.units;
      const unitKeys = Object.keys(units);
      
      // 创建换算器HTML
      let html = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- 输入部分 -->
          <div class="lg:col-span-1 space-y-6">
            <div class="bg-blue-50 rounded-xl p-6">
              <h3 class="text-lg font-semibold mb-4">输入值</h3>
              <div class="space-y-4">
                <div>
                  <label for="input-value" class="block text-sm font-medium text-gray-700 mb-1">数值</label>
                  <input type="number" id="input-value" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入数值" value="1" step="any">
                </div>
                <div>
                  <label for="base-unit" class="block text-sm font-medium text-gray-700 mb-1">基准单位</label>
                  <div class="relative">
                    <select id="base-unit" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent appearance-none">
                      ${unitKeys.map(key => `
                        <option value="${key}">${units[key].name} (${key})</option>
                      `).join('')}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                      <i class="fa fa-chevron-down text-xs"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="bg-gray-50 rounded-xl p-6">
              <h3 class="text-lg font-semibold mb-4">单位系统筛选</h3>
              <div class="space-y-2">
                <label class="flex items-center">
                  <input type="checkbox" id="filter-metric" class="form-checkbox h-5 w-5 text-primary" checked>
                  <span class="ml-2 text-sm">公制单位</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" id="filter-imperial" class="form-checkbox h-5 w-5 text-primary" checked>
                  <span class="ml-2 text-sm">英制单位</span>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" id="filter-chinese" class="form-checkbox h-5 w-5 text-primary" checked>
                  <span class="ml-2 text-sm">市制单位</span>
                </label>
              </div>
            </div>
          </div>
          
          <!-- 结果显示部分 -->
          <div class="lg:col-span-2">
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
              <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold">所有单位换算结果</h3>
                <p class="text-sm text-gray-500 mt-1">实时显示与基准单位的换算结果</p>
              </div>
              <div id="results-container" class="max-h-[500px] overflow-y-auto">
                <!-- 结果将通过JavaScript动态生成 -->
              </div>
            </div>
          </div>
        </div>
      `;
      
      converterContent.innerHTML = html;
      
      // 获取元素
      const inputValue = document.getElementById('input-value');
      const baseUnit = document.getElementById('base-unit');
      const filterMetric = document.getElementById('filter-metric');
      const filterImperial = document.getElementById('filter-imperial');
      const filterChinese = document.getElementById('filter-chinese');
      
      // 绑定事件 - 使用防抖处理输入事件
      const debouncedConvert = debounce(() => {
        convertToAllUnits(categoryKey);
      }, 150);
      
      inputValue.addEventListener('input', debouncedConvert);
      baseUnit.addEventListener('change', debouncedConvert);
      filterMetric.addEventListener('change', debouncedConvert);
      filterImperial.addEventListener('change', debouncedConvert);
      filterChinese.addEventListener('change', debouncedConvert);
      
      // 初始计算一次
      convertToAllUnits(categoryKey);
    }

    // 转换为所有单位并显示结果
    function convertToAllUnits(categoryKey) {
      const inputValue = document.getElementById('input-value').value;
      const baseUnitKey = document.getElementById('base-unit').value;
      const resultsContainer = document.getElementById('results-container');
      
      // 获取筛选条件
      const showMetric = document.getElementById('filter-metric').checked;
      const showImperial = document.getElementById('filter-imperial').checked;
      const showChinese = document.getElementById('filter-chinese').checked;
      
      // 验证输入
      if (!inputValue || !baseUnitKey) {
        resultsContainer.innerHTML = `
          <div class="text-center py-10 text-gray-500">
            <i class="fa fa-info-circle mb-2"></i> 请输入数值并选择基准单位
          </div>
        `;
        return;
      }
      
      const value = parseFloat(inputValue);
      const category = unitData[categoryKey];
      const units = category.units;
      const baseUnit = units[baseUnitKey];
      
      // 按单位系统分组
      const results = {
        metric: [],
        imperial: [],
        chinese: []
      };
      
      // 计算所有单位的结果
      Object.keys(units).forEach(targetUnitKey => {
        if (targetUnitKey === baseUnitKey) return; // 跳过基准单位
        
        const targetUnit = units[targetUnitKey];
        let result;
        
        // 特殊处理温度单位
        if (categoryKey === 'temperature') {
          // 转换为开尔文（基础单位）
          const kelvin = baseUnit.toBase(value);
          // 从开尔文转换为目标单位
          result = targetUnit.fromBase(kelvin);
        } else {
          // 其他单位的换算
          // 转换为基础单位
          const baseValue = value * baseUnit.base;
          // 从基础单位转换为目标单位
          result = baseValue / targetUnit.base;
        }
        
        // 只添加符合筛选条件的单位
        if (
          (targetUnit.system === 'metric' && showMetric) ||
          (targetUnit.system === 'imperial' && showImperial) ||
          (targetUnit.system === 'chinese' && showChinese)
        ) {
          results[targetUnit.system].push({
            key: targetUnitKey,
            name: targetUnit.name,
            symbol: targetUnitKey,
            value: result,
            system: targetUnit.system
          });
        }
      });
      
      // 生成结果HTML
      let html = '';
      
      // 添加公制单位结果
      if (showMetric && results.metric.length > 0) {
        html += `
          <div class="p-4 border-b border-gray-100 bg-blue-50">
            <h4 class="font-medium text-blue-800">公制单位</h4>
          </div>
        `;
        
        results.metric.forEach(item => {
          html += createResultItem(item, value, baseUnit);
        });
      }
      
      // 添加英制单位结果
      if (showImperial && results.imperial.length > 0) {
        html += `
          <div class="p-4 border-b border-gray-100 bg-green-50">
            <h4 class="font-medium text-green-800">英制单位</h4>
          </div>
        `;
        
        results.imperial.forEach(item => {
          html += createResultItem(item, value, baseUnit);
        });
      }
      
      // 添加市制单位结果
      if (showChinese && results.chinese.length > 0) {
        html += `
          <div class="p-4 border-b border-gray-100 bg-yellow-50">
            <h4 class="font-medium text-yellow-800">市制单位</h4>
          </div>
        `;
        
        results.chinese.forEach(item => {
          html += createResultItem(item, value, baseUnit);
        });
      }
      
      // 如果没有结果显示提示
      if (html === '') {
        html = `
          <div class="text-center py-10 text-gray-500">
            <i class="fa fa-filter mb-2"></i> 没有符合筛选条件的单位
          </div>
        `;
      }
      
      // 显示基准单位信息
      const baseUnitHtml = `
        <div class="p-4 border-b border-gray-200 bg-primary/5">
          <div class="result-item-header">
            基准单位: ${baseUnit.name} (${baseUnitKey})
            <span class="${baseUnit.system === 'metric' ? 'metric-badge' : baseUnit.system === 'imperial' ? 'imperial-badge' : 'chinese-badge'}">
              ${baseUnit.system === 'metric' ? '公制' : baseUnit.system === 'imperial' ? '英制' : '市制'}
            </span>
          </div>
          <div class="result-item-value">${formatNumber(value)} ${baseUnitKey}</div>
        </div>
      `;
      
      resultsContainer.innerHTML = baseUnitHtml + html;
    }

    // 创建结果项HTML
    function createResultItem(item, originalValue, baseUnit) {
      return `
        <div class="result-item">
          <div class="result-item-header">
            ${item.name} (${item.symbol})
            <span class="${item.system === 'metric' ? 'metric-badge' : item.system === 'imperial' ? 'imperial-badge' : 'chinese-badge'}">
              ${item.system === 'metric' ? '公制' : item.system === 'imperial' ? '英制' : '市制'}
            </span>
          </div>
          <div class="result-item-value">${formatNumber(item.value)}</div>
          <div class="text-xs text-gray-500 mt-1">
            = ${formatNumber(originalValue)} ${baseUnit.name}
          </div>
        </div>
      `;
    }

    // 格式化数字（添加千位分隔符，控制小数位数）
    function formatNumber(num, decimalPlaces = 6) {
      // 处理NaN
      if (isNaN(num)) return '0';
      
      // 处理非常大或非常小的数字，使用科学计数法
      if (Math.abs(num) >= 1e10 || Math.abs(num) < 1e-6) {
        return num.toExponential(6);
      }
      
      // 对于普通数字，根据大小决定保留的小数位数
      let precision = decimalPlaces;
      if (num >= 1000) precision = 2;
      else if (num >= 100) precision = 3;
      else if (num >= 10) precision = 4;
      
      // 格式化数字
      let formatted = parseFloat(num.toFixed(precision)).toString();
      
      // 添加千位分隔符
      if (formatted.includes('e')) {
        return formatted;
      }
      
      const parts = formatted.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      
      return parts.join('.');
    }

    // 防抖函数 - 优化性能，避免频繁计算
    function debounce(func, wait) {
      let timeout;
      return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
      };
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
