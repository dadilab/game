        .header-title {

        }

        .status-dot {

        .header-btn {

            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .teleprompter {
            flex: 1;
            overflow: hidden;
            position: relative;
            padding: 30px;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        #text-content {
            font-size: 32px;

        /* 主容器 */
        .main-container {
            display: flex;

        /* 控制面板 */
        .control-panel {

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        /* 控制组样式 */
        .control-group {

        .control-group-title {

        label {

            font-size: 1.05rem;
            display: flex;
            align-items: center;

            color: #5a3e1f;

        input[type="range"] {
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, #e67e22, #f39c12);
            border-radius: 10px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;

        input[type="range"]::-webkit-slider-thumb:hover {

        input[type="color"] {

        .btn-group {

        .upload-btn {

        .instructions {

        .empty-state {

            color: #c9b8a5;

        .value-display {

        /* 响应式设计 */
        @media (max-width: 768px) {
            .teleprompter-container {
                height: 250px;

            h1 {
                font-size: 2rem;

            .orange-icon {
                font-size: 2.2rem;
            }
            
            .teleprompter-header {
                flex-direction: column;

            .header-title {
                width: 100%;
                justify-content: space-between;
            }
            
            .header-controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            #text-content {
                font-size: 26px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
            .cta-button {
            background: #e67e22;
            color: white;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);

        }
        .cta-button:hover {
            background: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 84, 0, 0.4);
        }
    </style>

<body youdao="bind">
    <!-- 标题 -->
    <header>
        <h1>
            <i class="fas fa-apple-alt orange-icon"></i>
            橙子老师专门给你做的在线提词器
        </h1>
        <p class="subtitle">上传您的文本，享受流畅的提词体验</p>
    </header>
    
    <!-- 提词器区域 -->
    <div class="teleprompter-container">
        <div class="teleprompter-header">
            <div class="header-title">
                <div>
                    <i class="fas fa-microphone-alt"></i> 当前提词内容
                </div>
                <button id="reset-btn" class="header-btn">

        </div>
        <!-- 原有样式保留 -->
        <style>
        .cta-button {
            background: #e67e22;
            color: white;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }
        </style>
    </div>



    <!-- 控制区域 -->
    <div class="main-container">
        <div class="control-panel">
            <div class="controls">
                <div class="control-group">
                    <div class="control-group-title">
                        <i class="fas fa-sliders-h"></i> 滚动控制
                    </div>
                    
                    <label for="speed-control">

                    <div class="value-display" id="line-height-value">0.8</div>

                <div class="control-group">
                    <div class="control-group-title">

                    </div>
                    
                    <label for="font-size">
                        <i class="fas fa-text-height"></i> 文字大小
                    </label>
                    <input type="range" id="font-size" min="20" max="60" value="32">
                    <div class="value-display" id="font-size-value">32px</div>
                    
                    <label for="width-control">
                        <i class="fas fa-arrows-alt-h"></i> 文本宽度
                    </label>
                    <input type="range" id="width-control" min="40" max="100" value="80">
                    <div class="value-display" id="width-value">80%</div>

                <div class="control-group">
                    <div class="control-group-title">

                    </div>

                    </label>
                    <input type="color" id="text-color" value="#5a3e1f">
                    
                    <label for="bg-color">
                        <i class="fas fa-fill"></i> 背景颜色
                    </label>
                    <input type="color" id="bg-color" value="#ffffff">
                </div>
            </div>
        </div>
        
        <!-- 上传区域 - 现在在底部 -->
        <div class="upload-section">
            <label for="file-upload" class="upload-btn">
                <i class="fas fa-cloud-upload-alt"></i> 上传文本文件 (.txt)
            </label>
            <input type="file" id="file-upload" accept=".txt">
            <p class="instructions">支持TXT格式文件，内容将自动导入提词器</p>
        </div>

        <!-- 课程宣传模块 -->
        <div class="cta-section" style="margin:30px auto; text-align:center; padding:25px 0;">
            <p style="font-size:1.2rem; color:#e67e22; margin-bottom:15px;">点这里</p>
            <a href="https://www.xudadi.com" target="_blank" class="cta-button">查看</a>
        </div>

    <script>
        // DOM元素
        const fileUpload = document.getElementById('file-upload');
        const textContent = document.getElementById('text-content');
        const speedControl = document.getElementById('speed-control');
        const speedValue = document.getElementById('speed-value');
        const fontSizeControl = document.getElementById('font-size');
        const fontSizeValue = document.getElementById('font-size-value');
        const lineHeightControl = document.getElementById('line-height');
        const lineHeightValue = document.getElementById('line-height-value');
        const textColor = document.getElementById('text-color');
        const bgColor = document.getElementById('bg-color');
        const widthControl = document.getElementById('width-control');
        const widthValue = document.getElementById('width-value');
        const playPauseBtn = document.getElementById('play-pause');
        const resetBtn = document.getElementById('reset-btn');
        const teleprompter = document.querySelector('.teleprompter');
        const status = document.querySelector('.status');
        const statusDot = document.querySelector('.status-dot');
        const statusText = document.querySelector('.status span');
        
        // 状态变量
        let isPlaying = false;
        let scrollAnimation;
        let currentSpeed = 8;
        let scrollPosition = 0;
        let contentHeight = 0;
        
        // 处理文件上传
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    // 将文本按行分割
                    const lines = content.split('\n').filter(line => line.trim() !== '');
                    
                    // 生成HTML
                    let htmlContent = '';
                    lines.forEach((line, index) => {
                        htmlContent += `<div class="line" style="padding: 15px 0;">${line}</div>`;
                    });
                    
                    textContent.innerHTML = htmlContent;
                    textContent.style.opacity = '1';
                    scrollPosition = 0;
                    textContent.scrollTop = 0;
                    
                    // 计算内容高度
                    contentHeight = textContent.scrollHeight;
                };
                reader.readAsText(file);
            }
        });
        
        // 调整滚动速度
        speedControl.addEventListener('input', function() {
            currentSpeed = parseInt(this.value);
            updateSpeedDisplay();
            
            // 如果正在播放，则重启滚动
            if (isPlaying) {
                startScrolling();
            }
        });
        
        function updateSpeedDisplay() {
            let speedText;
            if (currentSpeed <= 4) speedText = "慢速";
            else if (currentSpeed <= 8) speedText = "中等";
            else if (currentSpeed <= 12) speedText = "快速";
            else if (currentSpeed <= 16) speedText = "超快";
            else speedText = "极速";
            
            speedValue.textContent = `${speedText} (${currentSpeed})`;
        }
        
        // 调整文字大小
        fontSizeControl.addEventListener('input', function() {
            const size = this.value + 'px';
            textContent.style.fontSize = size;
            fontSizeValue.textContent = size;
            
            // 更新内容高度
            if (textContent.children.length > 0) {
                contentHeight = textContent.scrollHeight;
            }
        });
        
        // 调整行距大小
        lineHeightControl.addEventListener('input', function() {
            const lineHeight = this.value;
            textContent.style.lineHeight = lineHeight;
            lineHeightValue.textContent = lineHeight;
            
            // 更新内容高度
            if (textContent.children.length > 0) {
                contentHeight = textContent.scrollHeight;
            }
        });
        
        // 调整文字颜色
        textColor.addEventListener('input', function() {
            textContent.style.color = this.value;
        });
        
        // 调整背景颜色
        bgColor.addEventListener('input', function() {
            teleprompter.style.backgroundColor = this.value;
        });
        
        // 调整文本宽度
        widthControl.addEventListener('input', function() {
            const width = this.value + '%';
            textContent.style.width = width;
            textContent.style.margin = '0 auto';
            widthValue.textContent = width;
            
            // 更新内容高度
            if (textContent.children.length > 0) {
                contentHeight = textContent.scrollHeight;
            }
        });
        
        // 开始/暂停按钮
        playPauseBtn.addEventListener('click', function() {
            if (textContent.children.length === 0) {
                alert('请先上传文本内容！');
                return;
            }
            
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                startScrolling();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停滚动';
                statusDot.style.background = '#27ae60';
                statusDot.style.boxShadow = '0 0 8px #27ae60';
                statusText.textContent = '滚动中...';
                status.classList.add('playing');
            } else {
                stopScrolling();
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i> 继续滚动';
                statusDot.style.background = '#e74c3c';
                statusDot.style.boxShadow = 'none';
                statusText.textContent = '已暂停';
                status.classList.remove('playing');
            }
        });
        
        // 重置按钮
        resetBtn.addEventListener('click', function() {
            stopScrolling();
            isPlaying = false;
            scrollPosition = 0;
            textContent.style.transform = 'translateY(0)';
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i> 开始滚动';
            statusDot.style.background = '#e74c3c';
            statusDot.style.boxShadow = 'none';
            statusText.textContent = '已暂停';
            status.classList.remove('playing');
        });
        
        // 开始滚动函数
        function startScrolling() {
            // 清除任何现有的滚动
            if (scrollAnimation) cancelAnimationFrame(scrollAnimation);
            
            const startTime = performance.now();
            const duration = 100000 / currentSpeed; // 根据速度调整持续时间
            
            function scrollStep(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 计算滚动位置（从0到内容高度）
                scrollPosition = progress * contentHeight;
                
                // 应用滚动
                textContent.style.transform = `translateY(-${scrollPosition}px)`;
                
                // 检查是否滚动到底部
                if (progress < 1 && isPlaying) {
                    scrollAnimation = requestAnimationFrame(scrollStep);
                } else if (progress >= 1) {
                    // 滚动完成
                    stopScrolling();
                    isPlaying = false;
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i> 重新开始';
                    statusDot.style.background = '#e74c3c';
                    statusDot.style.boxShadow = 'none';
                    statusText.textContent = '播放完成';
                    status.classList.remove('playing');
                }
            }
            
            scrollAnimation = requestAnimationFrame(scrollStep);
        }
        
        // 停止滚动函数
        function stopScrolling() {
            if (scrollAnimation) {
                cancelAnimationFrame(scrollAnimation);
                scrollAnimation = null;
            }
        }
        
        // 初始化显示
        updateSpeedDisplay();
        
        // 添加示例文本
        window.addEventListener('load', function() {
            // 添加示例文本
            const sampleText = `欢迎使用许老师的提词器！
            
在这里，您可以上传任何TXT格式的文稿
点击"开始滚动"按钮后文字会匀速向上滚动

// 禁止右键菜单
document.addEventListener('contextmenu', function(e) {

// 禁止选择文本
document.addEventListener('selectstart', function(e) {
    e.preventDefault();
    return false;
});

// 禁止拖拽
document.addEventListener('dragstart', function(e) {
    e.preventDefault();
    return false;
});

// 禁止各种快捷键
document.addEventListener('keydown', function(e) {
    // 禁止F12开发者工具
    if (e.keyCode === 123) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+Shift+I (开发者工具)
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+Shift+C (检查元素)
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+Shift+J (控制台)
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+U (查看源代码)
    if (e.ctrlKey && e.keyCode === 85) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+A (全选)
    if (e.ctrlKey && e.keyCode === 65) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+C (复制)
    if (e.ctrlKey && e.keyCode === 67) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+V (粘贴)
    if (e.ctrlKey && e.keyCode === 86) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+X (剪切)
    if (e.ctrlKey && e.keyCode === 88) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+S (保存)
    if (e.ctrlKey && e.keyCode === 83) {
        e.preventDefault();
        return false;
    }
    
    // 禁止Ctrl+P (打印)
    if (e.ctrlKey && e.keyCode === 80) {
        e.preventDefault();
        return false;
    }
});

`;
document.head.appendChild(style);
